name: Jupyter Book Build (Check)

# Build-only workflow: fängt Fehler auf Feature-Branches und Pull Requests ab,
# bevor sie nach `main` gemergt werden. Das Deployment übernimmt `deploy.yml`.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read

# Ein laufender Prüfbuild pro Ref genügt; neue Pushes brechen den alten ab.
concurrency:
  group: 'build-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Build HTML Assets
        run: uv run jupyter book build --execute --all --html

      - name: Upload build output
        uses: actions/upload-artifact@v5
        with:
          name: jupyter-book-html
          path: ./_build/html
          retention-days: 7
