version: 1
project:
  id: 009c9d71-a4fc-4438-8118-31289551ac9b
  title: Selbstlernkurs Python
  description: |
    Dieser Selbstlernkurs soll angehende Bibliotheks- und Informationswissenschaftler\*innen (insbesondere im weiterbildenden Masterstudiengang an der Humboldt-Universität zu Berlin) befähigen kleinere Programmieraufgaben mit bibliothekarischen Daten umzusetzen.
  keywords:
    ["Open Educational Resource", "Python", "Bibliothek", "Selbstlernkurs"]
  authors:
    - name: "Hannes Schnaitter"
      affiliations:
        - Humboldt-Universität zu Berlin, Institut für Bibliotheks- und Informationswissenschaft
      orcid: 0000-0002-1602-6032
      corresponding: true
      email: hannes.schnaitter.1@ibi.hu-berlin.de
      github: schnaitter
      roles:
        - Writing
      id: schnaitter
  github: https://github.com/schnaitter/Selbstlernkurs_Python
  # Thebe (JupyterLite-„Start compute environment") vorerst deaktiviert, weil
  # es die JupyterQuiz-Ausgaben im Browser überschreibt. Entspricht dem früheren
  # Alias `jupyter: {lite: true}`.
  thebe: false
  static_files:
    - assets/pypi
    - assets/data/books_powerlaw_dataset.csv
  binder: https://mybinder.org/v2/gh/schnaitter/Selbstlernkurs_Python/main
  exclude:
    - _build
    - README.md
    - LICENSE.md
  license:
    content: CC-BY-4.0
    code: MIT
  exports:
